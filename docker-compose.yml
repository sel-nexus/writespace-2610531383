services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/writespace.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - writespace-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  writespace-data:
